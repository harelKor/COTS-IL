name: Catalog sync

on:
  schedule:
    - cron: "0 2 * * *"
  # "סנכרון עכשיו" in /admin/settings/suppliers dispatches this with one supplier's code.
  workflow_dispatch:
    inputs:
      supplier:
        description: "Supplier code (empty = every supplier with nightly sync on; a BigCommerce supplier gets a full read)"
        required: false
        default: ""

# Never run two syncs at once. A failed run emails the repo owner through GitHub.
concurrency:
  group: catalog-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    # Saturday's run also reads every goBILDA and REV page, one a second (about an hour).
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Sync
        # The code comes in through env, never pasted into the script.
        run: |
          if [ -n "$SUPPLIER" ]; then
            [[ "$SUPPLIER" =~ ^[a-z0-9][a-z0-9-]{1,23}$ ]] || { echo "bad supplier code"; exit 1; }
            npm run sync -- "$SUPPLIER"
          else
            npm run sync
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPPLIER: ${{ inputs.supplier }}
      # Pages cache the catalog for hours; mark it stale so they show this sync.
      # Runs even if one supplier failed, since the others were saved.
      # Each route records its own success in job_runs (the health list on /admin, M1); when the
      # site doesn't answer, job-report records the failure, and the step fails after both calls.
      - name: Refresh the site's catalog cache, then reminders and the digest
        if: ${{ !cancelled() }}
        run: |
          status=0
          call() {
            local job="$1" path="$2" out
            if out=$(curl --fail-with-body -sS -X POST -H "Authorization: Bearer $REVALIDATE_SECRET" "https://cots-il.vercel.app$path" 2>&1); then
              echo "$job: $out"
            else
              echo "::error::$job failed: $out"
              npm run -s job-report -- "$job" failed "$(printf '%s' "$out" | tail -c 250)"
              status=1
            fi
          }
          call revalidate /api/revalidate
          # Quote reminders and the admin digest (S3); does nothing until email is set up.
          call daily_digest /api/notify/daily
          exit $status
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
