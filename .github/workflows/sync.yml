name: Catalog sync

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

# Never run two syncs at once. A failed run emails the repo owner through GitHub.
concurrency:
  group: catalog-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
