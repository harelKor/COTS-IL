name: Database backup

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

# Backs up the app's data and user accounts, encrypted, as a 30-day artifact on
# this private repo. A failed run emails the repo owner through GitHub, and every run records
# its outcome in job_runs for the health list on /admin (M1).
# docs/admin-guide.md explains how to restore.
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$BACKUP_PASSPHRASE" || { echo "BACKUP_PASSPHRASE secret is missing"; exit 1; }
          # pg_dump needs a session connection: the pooler's port 5432, not the app's 6543.
          SESSION_URL="${DATABASE_URL/:6543\//:5432\/}"
          docker run --rm -e SESSION_URL="$SESSION_URL" postgres:17 \
            sh -c 'pg_dump "$SESSION_URL" --format=custom --no-owner --no-privileges --schema=public --schema=auth' > backup.dump
          test "$(stat -c %s backup.dump)" -gt 10000 || { echo "Backup is suspiciously small"; exit 1; }
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 --output backup.dump.gpg backup.dump
      - uses: actions/upload-artifact@v5
        with:
          name: backup-${{ github.run_id }}
          path: backup.dump.gpg
          retention-days: 30
          if-no-files-found: error
      # The outcome, for the health list on /admin and the watchdog's email (M1).
      - name: Record the outcome
        if: ${{ always() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        run: |
          ok=false; [ "$JOB_STATUS" = "success" ] && ok=true
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || RUN_ID=0
          sql="INSERT INTO job_runs (job, ok, detail) VALUES ('backup', $ok, jsonb_build_object('source', 'github', 'run', '$RUN_ID'))"
          docker run --rm -e DATABASE_URL="$DATABASE_URL" postgres:17 psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "$sql" \
            || echo "::warning::could not record the backup's outcome"
