<!doctype html>
<html lang="he" dir="rtl">
  <body style="margin:0;background:#F6F9FF;font-family:-apple-system,'Segoe UI',Heebo,Arial,sans-serif;color:#0B1528">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F6F9FF;padding:24px 12px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFFFF;border:1px solid #D8E4FA;border-radius:18px;padding:28px 24px;text-align:right" dir="rtl">
            <tr>
              <td>
                <p style="margin:0 0 20px;font-size:20px;font-weight:600;color:#1D4ED8" dir="ltr" align="right">BLUEHUB</p>
                <p style="margin:0 0 8px;font-size:17px">קוד הכניסה שלכם:</p>
                <p style="margin:0 0 20px;font-size:34px;font-weight:600;letter-spacing:8px;font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#0B1528" dir="ltr" align="right">{{ .Token }}</p>
                <p style="margin:0 0 24px;font-size:15px;color:#52658A">הקלידו אותו בחלון שבו ביקשתם להיכנס. הקוד תקף לשעה.</p>
                <p style="margin:0 0 8px;font-size:15px;color:#52658A">או היכנסו בלחיצה, מכל דפדפן או מכשיר (הסל שלכם יחכה שם):</p>
                <p style="margin:0 0 24px">
                  <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#1D4ED8;color:#FFFFFF;text-decoration:none;font-weight:600;font-size:15px;padding:12px 24px;border-radius:999px">כניסה ל-BLUEHUB</a>
                </p>
                <p style="margin:0;font-size:13px;color:#52658A">לא ביקשתם להיכנס? אפשר להתעלם מהמייל הזה.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
